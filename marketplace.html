<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Listings</title>
<style>
  :root{
    --accent:#0f5c4c;
    --accent-dark:#0b4638;
    --ink:#1a2420;
    --muted:#5b6b64;
    --line:#e3e8e5;
    --bg:#f7f9f8;
    --card:#ffffff;
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
  }
  a{ color:inherit; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------- Header ---------- */
  header.site-header{
    position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; overflow:hidden; flex:none;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; }
  .header-tag{ color:var(--muted); font-size:13px; font-weight:500; }

  /* ---------- Hero / search ---------- */
  .hero{
    background:linear-gradient(180deg,#0f5c4c 0%,#0b4638 100%); color:#fff;
    padding:48px 24px 64px;
  }
  .hero h1{ margin:0 0 6px; font-size:clamp(26px,4vw,38px); }
  .hero p{ margin:0 0 26px; color:#d8ece6; font-size:15px; }
  .search-bar{
    background:#fff; border-radius:16px; padding:14px; display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto; gap:10px; box-shadow:0 12px 30px rgba(0,0,0,.18);
  }
  .search-bar input, .search-bar select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    font-size:14px; color:var(--ink); background:#fbfcfc;
  }
  .search-bar button{
    background:var(--accent); color:#fff; border:none; border-radius:9px; padding:11px 20px;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .search-bar button:hover{ background:var(--accent-dark); }
  @media (max-width:860px){
    .search-bar{ grid-template-columns:1fr 1fr; }
    .search-bar input{ grid-column:1 / -1; }
  }

  /* ---------- Results ---------- */
  .results-wrap{ max-width:1160px; margin:0 auto; padding:28px 24px 60px; }
  .results-bar{ color:var(--muted); font-size:14px; margin:0 0 16px; padding-top:14px; }
  .listing-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:20px; }
  .card{
    background:var(--card); border-radius:var(--radius); overflow:hidden; cursor:pointer;
    border:1px solid var(--line); box-shadow:0 1px 3px rgba(20,30,25,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,30,25,.12); }
  .card-photo{ position:relative; aspect-ratio:4/3; background:#e9efec; }
  .card-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-photo .no-photo{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#9fb0a8; font-size:13px; }
  .featured-badge{
    position:absolute; top:10px; left:10px; background:#f5b301; color:#3a2c00; font-size:11px;
    font-weight:800; letter-spacing:.03em; padding:4px 9px; border-radius:999px; text-transform:uppercase;
  }
  .card-body{ padding:14px 16px 16px; }
  .card-price{ font-size:19px; font-weight:800; margin-bottom:2px; }
  .card-address{ font-size:13.5px; color:var(--muted); margin-bottom:10px; line-height:1.35; }
  .card-specs{ display:flex; gap:12px; font-size:13px; color:var(--ink); font-weight:600; }
  .card-specs span{ color:var(--muted); font-weight:500; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }

  /* ---------- Detail ---------- */
  .back-link{ background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; cursor:pointer; padding:0 0 18px; }
  .detail-layout{ display:grid; grid-template-columns:1.5fr 1fr; gap:32px; align-items:start; }
  @media (max-width:900px){ .detail-layout{ grid-template-columns:1fr; } }

  .gallery-main{ border-radius:var(--radius); overflow:hidden; aspect-ratio:16/10; background:#e9efec; margin-bottom:10px; }
  .gallery-main img{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-thumbs{ display:flex; gap:8px; flex-wrap:wrap; }
  .gallery-thumbs img{
    width:76px; height:56px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent;
  }
  .gallery-thumbs img.active{ border-color:var(--accent); }

  .detail-price{ font-size:30px; font-weight:800; }
  .detail-address{ color:var(--muted); font-size:15px; margin:4px 0 18px; }
  .detail-specs{ display:flex; flex-wrap:wrap; gap:10px 22px; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:18px; }
  .spec-item{ font-size:14px; }
  .spec-item b{ display:block; font-size:17px; }
  .spec-item span{ color:var(--muted); }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip{ background:#eaf3ef; color:var(--accent-dark); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; }
  .detail-notes{ font-size:14px; line-height:1.55; color:#37423d; margin-bottom:24px; }

  .contact-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; }
  .contact-card h3{ margin:0 0 4px; font-size:17px; }
  .contact-card p{ margin:0 0 16px; color:var(--muted); font-size:13.5px; }
  .contact-card form{ display:flex; flex-direction:column; gap:10px; }
  .contact-card input, .contact-card textarea{
    padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; resize:vertical;
  }
  .contact-card button{
    background:var(--accent); color:#fff; border:none; border-radius:9px; padding:12px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .contact-card button:disabled{ opacity:.6; cursor:default; }
  .lead-success{ background:#eaf6ee; color:#1f6a3a; border-radius:9px; padding:14px; font-size:14px; font-weight:600; }
  .lead-error{ background:#fdeceb; color:#a1281a; border-radius:9px; padding:10px 12px; font-size:13px; margin-top:2px; }

  footer{ text-align:center; padding:30px; color:var(--muted); font-size:12.5px; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark" id="brand-mark">H</span>
    <span id="brand-name">Loading…</span>
  </div>
  <span class="header-tag">Listed by our agents</span>
</header>

<!-- LISTINGS -->
<section id="screen-list" class="screen active">
  <div class="hero">
    <h1>Find your next home</h1>
    <p>Browse active listings from our agents.</p>
    <div class="search-bar">
      <input id="search-input" placeholder="City, address, or ZIP">
      <select id="filter-type">
        <option value="">All property types</option>
        <option>Single-Family Home</option>
        <option>Condominium</option>
        <option>Townhouse</option>
        <option>Multi-Family</option>
        <option>Land / Lot</option>
        <option>Other</option>
      </select>
      <select id="filter-beds">
        <option value="">Any beds</option>
        <option value="1">1+ beds</option>
        <option value="2">2+ beds</option>
        <option value="3">3+ beds</option>
        <option value="4">4+ beds</option>
        <option value="5">5+ beds</option>
      </select>
      <select id="filter-price">
        <option value="">Any price</option>
        <option value="200000">$200k+</option>
        <option value="400000">$400k+</option>
        <option value="600000">$600k+</option>
        <option value="800000">$800k+</option>
        <option value="1000000">$1M+</option>
      </select>
      <button id="search-btn" type="button">Search</button>
    </div>
  </div>
  <div class="results-wrap">
    <div class="results-bar" id="results-count"></div>
    <div class="listing-grid" id="listing-grid"></div>
    <div class="empty-state" id="empty-state" hidden>No listings match your search right now.</div>
  </div>
</section>

<!-- DETAIL -->
<section id="screen-detail" class="screen">
  <div class="results-wrap">
    <button class="back-link" id="back-to-list">‹ Back to listings</button>
    <div class="detail-layout">
      <div>
        <div class="gallery-main"><img id="gallery-main-img" alt="Listing photo"></div>
        <div class="gallery-thumbs" id="gallery-thumbs"></div>
      </div>
      <div>
        <div class="detail-price" id="detail-price"></div>
        <div class="detail-address" id="detail-address"></div>
        <div class="detail-specs" id="detail-specs"></div>
        <div class="chip-row" id="detail-features"></div>
        <div class="detail-notes" id="detail-notes"></div>

        <div class="contact-card">
          <h3>Interested in this home?</h3>
          <p>Send a message and one of our agents will follow up.</p>
          <form id="lead-form">
            <input id="lead-name" placeholder="Your name" required>
            <input id="lead-email" type="email" placeholder="Email address" required>
            <input id="lead-phone" placeholder="Phone (optional)">
            <textarea id="lead-message" rows="3" placeholder="I'd like to schedule a showing…"></textarea>
            <button type="submit" id="lead-submit-btn">Request info</button>
          </form>
          <div class="lead-success" id="lead-success" hidden>Thanks! An agent will be in touch soon.</div>
          <div class="lead-error" id="lead-error" hidden></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer id="footer-line">Powered by Fieldsheet</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // Same project as Fieldsheet -- this page only ever uses the public
  // (anon) key, and only reads/writes what the anon RLS policies in
  // schema.sql explicitly allow (active listings, company name/logo, and
  // creating new leads). It can't see draft listings or anyone's CRM data.
  var SUPABASE_URL = 'https://ohtiuqghsmuvlthhvkcn.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_0tz9RnGQB8yiEbpsumkwlw_QPRn-r6L';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function $(id){ return document.getElementById(id); }
  function show(id){
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){ s.classList.remove('active'); });
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function fmtMoney(n){
    if(n === null || n === undefined || n === '' || isNaN(n)) return 'Price on request';
    return '$' + Number(n).toLocaleString('en-US');
  }

  var company = null;
  var allListings = [];
  var currentListing = null;

  // A brokerage's public site is reached as marketplace.html?co=<their-slug>.
  // With no slug (e.g. while there's only one brokerage set up), it just
  // shows the first company it finds -- handy for testing before you have
  // more than one customer.
  var companySlug = new URLSearchParams(location.search).get('co');

  function firstPhoto(listing){
    var rp = listing.room_photos || {};
    for(var room in rp){ if(rp[room] && rp[room].length) return rp[room][0]; }
    return null;
  }
  function allPhotos(listing){
    var rp = listing.room_photos || {};
    var out = [];
    Object.keys(rp).forEach(function(room){
      (rp[room] || []).forEach(function(src){ out.push({ room: room, src: src }); });
    });
    return out;
  }

  function renderBranding(){
    $('brand-name').textContent = company.name || 'Home Listings';
    $('footer-line').textContent = '© ' + new Date().getFullYear() + ' ' + (company.name || '') + ' — Powered by Fieldsheet';
    document.title = company.name || 'Home Listings';
    var mark = $('brand-mark');
    if(company.logo_url){
      mark.innerHTML = '<img src="' + escapeHtml(company.logo_url) + '" alt="">';
    } else {
      mark.textContent = (company.name || 'H').trim().charAt(0).toUpperCase();
    }
  }

  function matchesFilters(l){
    var q = $('search-input').value.trim().toLowerCase();
    if(q){
      var hay = [l.address, l.city, l.state, l.zip].filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    var type = $('filter-type').value;
    if(type && l.property_type !== type) return false;
    var beds = $('filter-beds').value;
    if(beds && !(Number(l.bedrooms) >= Number(beds))) return false;
    var price = $('filter-price').value;
    if(price && !(Number(l.price) >= Number(price))) return false;
    return true;
  }

  function renderCard(l){
    var photo = firstPhoto(l);
    var addr = [l.address, l.unit].filter(Boolean).join(', ');
    var cityline = [l.city, l.state].filter(Boolean).join(', ') + (l.zip ? (' ' + l.zip) : '');
    var specs = [];
    if(l.bedrooms != null) specs.push('<b>' + l.bedrooms + '</b><span> bd</span>');
    if(l.bathrooms != null) specs.push('<b>' + l.bathrooms + '</b><span> ba</span>');
    if(l.sqft != null) specs.push('<b>' + Number(l.sqft).toLocaleString() + '</b><span> sqft</span>');
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-photo">' +
        (photo ? '<img src="' + escapeHtml(photo) + '" alt="">' : '<div class="no-photo">No photo yet</div>') +
        (l.featured ? '<div class="featured-badge">Featured</div>' : '') +
      '</div>' +
      '<div class="card-body">' +
        '<div class="card-price">' + fmtMoney(l.price) + '</div>' +
        '<div class="card-address">' + escapeHtml(addr || 'Address unavailable') + '<br>' + escapeHtml(cityline) + '</div>' +
        '<div class="card-specs">' + specs.join(' &nbsp;·&nbsp; ') + '</div>' +
      '</div>';
    card.addEventListener('click', function(){ openDetail(l); });
    return card;
  }

  function renderListings(){
    var filtered = allListings.filter(matchesFilters);
    var grid = $('listing-grid');
    grid.innerHTML = '';
    filtered.forEach(function(l){ grid.appendChild(renderCard(l)); });
    $('results-count').textContent = filtered.length + (filtered.length === 1 ? ' home' : ' homes') + ' available';
    $('empty-state').hidden = filtered.length > 0;
  }

  function openDetail(l){
    currentListing = l;
    var photos = allPhotos(l);
    $('gallery-main-img').src = photos.length ? photos[0].src : '';
    $('gallery-thumbs').innerHTML = photos.map(function(p, i){
      return '<img src="' + escapeHtml(p.src) + '" data-i="' + i + '" class="' + (i === 0 ? 'active' : '') + '" alt="' + escapeHtml(p.room) + '">';
    }).join('');
    Array.prototype.forEach.call($('gallery-thumbs').querySelectorAll('img'), function(img){
      img.addEventListener('click', function(){
        $('gallery-main-img').src = photos[Number(img.getAttribute('data-i'))].src;
        Array.prototype.forEach.call($('gallery-thumbs').querySelectorAll('img'), function(t){ t.classList.remove('active'); });
        img.classList.add('active');
      });
    });

    $('detail-price').textContent = fmtMoney(l.price);
    var addr = [l.address, l.unit].filter(Boolean).join(', ');
    var cityline = [l.city, l.state].filter(Boolean).join(', ') + (l.zip ? (' ' + l.zip) : '');
    $('detail-address').textContent = [addr, cityline].filter(Boolean).join(' — ');

    var specs = [];
    if(l.bedrooms != null) specs.push(['Bedrooms', l.bedrooms]);
    if(l.bathrooms != null) specs.push(['Bathrooms', l.bathrooms]);
    if(l.sqft != null) specs.push(['Sq Ft', Number(l.sqft).toLocaleString()]);
    if(l.lot_size != null) specs.push(['Lot', l.lot_size + ' ' + (l.lot_unit || '')]);
    if(l.year_built) specs.push(['Year Built', l.year_built]);
    if(l.property_type) specs.push(['Type', l.property_type]);
    $('detail-specs').innerHTML = specs.map(function(s){
      return '<div class="spec-item"><b>' + escapeHtml(String(s[1])) + '</b><span>' + escapeHtml(s[0]) + '</span></div>';
    }).join('');

    var features = l.features || [];
    $('detail-features').innerHTML = features.map(function(f){ return '<span class="chip">' + escapeHtml(f) + '</span>'; }).join('');
    $('detail-notes').textContent = l.feature_notes || '';

    $('lead-form').reset();
    $('lead-success').hidden = true;
    $('lead-error').hidden = true;
    $('lead-form').hidden = false;

    show('screen-detail');
  }

  $('back-to-list').addEventListener('click', function(){ show('screen-list'); });
  $('search-btn').addEventListener('click', renderListings);
  ['search-input'].forEach(function(id){
    $(id).addEventListener('keydown', function(e){ if(e.key === 'Enter') renderListings(); });
  });
  ['filter-type', 'filter-beds', 'filter-price'].forEach(function(id){
    $(id).addEventListener('change', renderListings);
  });

  $('lead-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(!currentListing || !company) return;
    var btn = $('lead-submit-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    $('lead-error').hidden = true;
    sb.from('leads').insert({
      company_id: company.id,
      listing_id: currentListing.id,
      name: $('lead-name').value.trim(),
      email: $('lead-email').value.trim(),
      phone: $('lead-phone').value.trim() || null,
      message: $('lead-message').value.trim() || null,
      status: 'new'
    }).then(function(res){
      if(res.error){
        $('lead-error').textContent = 'Something went wrong sending your message. Please try again.';
        $('lead-error').hidden = false;
        return;
      }
      $('lead-form').hidden = true;
      $('lead-success').hidden = false;
    }).finally(function(){
      btn.disabled = false;
      btn.textContent = 'Request info';
    });
  });

  function showNoCompanyState(){
    $('brand-name').textContent = 'Home Listings';
    $('results-count').textContent = '';
    $('empty-state').textContent = 'This site isn\'t set up yet — no brokerage account was found.';
    $('empty-state').hidden = false;
  }

  function boot(){
    var companyQuery = companySlug
      ? sb.from('companies').select('*').eq('slug', companySlug).single()
      : sb.from('companies').select('*').limit(1).single();

    companyQuery.then(function(res){
      if(res.error || !res.data){ showNoCompanyState(); return; }
      company = res.data;
      renderBranding();
      return sb.from('listings').select('*').eq('company_id', company.id).eq('status', 'active');
    }).then(function(res){
      if(!res) return;
      if(res.error){ console.warn('Could not load listings:', res.error.message); return; }
      allListings = (res.data || []).sort(function(a, b){
        return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
      });
      renderListings();
    }).catch(function(err){
      console.warn('Marketplace boot failed:', err);
      showNoCompanyState();
    });
  }
  boot();
})();
</script>
</body>
</html>
